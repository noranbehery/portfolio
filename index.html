$("#ft").textContent=t.ft;let mh="";for(let r=0;r<6;r++)t.mq.forEach(x=>mh+=`<span><i>✦</i> ${x}</span>`);$("#mq").innerHTML=mh;
$("#s1").textContent=P.length;$("#s2").textContent=P.reduce((a,p)=>a+(p.g?p.g.length:p.n),0);$("#s3").textContent=5;
$("#svc").innerHTML=t.SV.map((s,j)=>`<div><button aria-expanded="false" aria-controls="p${j}"><span>${s[0]}</span></button><div class="pn" id="p${j}" role="region"><p>${s[1]}</p></div></div>`).join("");
document.querySelectorAll("#svc button").forEach(b=>b.onclick=()=>{const o=b.getAttribute("aria-expanded")=="true",p=$("#"+b.getAttribute("aria-controls"));b.setAttribute("aria-expanded",!o);p.style.maxHeight=o?0:p.scrollHeight+"px"});
$("#chips").innerHTML=["all","social","brand","web","ads","print"].map(k=>`<button data-k="${k}" aria-pressed="${k==F}">${t[k]}</button>`).join("");
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{F=b.dataset.k;home()});
$("#grid").innerHTML=P.filter(p=>F=="all"||p.cats.includes(F)).map(p=>`<a class="card" href="#${p.id}" aria-label="${p.t[i]}"><div class="im"><img src="${TH[p.cover]}" alt="${p.t[i]}" loading="lazy"></div><div class="cap"><h3>${p.t[i]}</h3><span>${p.cats.map(c=>t[c]).join(" · ")}</span></div></a>`).join("");
$("#ln").innerHTML=[`<a href="mailto:${CFG.email}">${CFG.email}</a>`].concat(Object.entries(CFG.links).filter(([k,v])=>v).map(([k,v])=>`<a href="${v}" target="_blank" rel="noopener">${k[0].toUpperCase()+k.slice(1)}</a>`)).join("");
document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==L))}
const bk=k=>{const[w,h]=DIM[k],r=w/h;return r>=2?"bn":r>=1.3?"ls":r>=.92?"sq":r>=.72?"po":r>=.5?"st":"tl"};
function galHTML(p,i){const ks=gal(p),btn=(k,j)=>`<button data-k="${k}" aria-label="${p.t[i]} ${j+1}"><img src="${TH[k]}" alt="${p.t[i]} — ${j+1}" loading="lazy"></button>`;
if(p.c){return `<div class="gal rw${p.zd?" zd":""}">${ks.map((k,j)=>{const[w,h]=DIM[k],r=(w/h).toFixed(3);return `<figure style="--r:${r}"${w/h>1.3?' class="wd"':""}><button data-k="${k}" aria-label="${p.c[j][i]}"><img src="${TH[k]}" alt="${p.c[j][i]}" loading="lazy"></button><figcaption>${p.c[j][i]}</figcaption></figure>`}).join("")}</div>`}
const order=["po","sq","st","ls","tl","bn"],g={};ks.forEach((k,j)=>{(g[bk(k)]=g[bk(k)]||[]).push([k,j])});
let h='<div class="gal">';order.filter(c=>g[c]).forEach(c=>{const a=g[c],n=a.length;let col=c=="bn"?1:c=="ls"?2:c=="tl"?4:c=="st"?4:3;
if(c=="po"||c=="sq"){if(n>3){const r3=n%3,r4=n%4;col=(r3==0)?3:(r4==0)?4:(r3>=r4?3:4)}}
if(c=="st")col=n<=5?n:(n%4==0?4:n%3==0?3:4);if(c=="tl"&&n<4)col=Math.max(n,2);col=Math.min(col,Math.max(n,1));
const ar=c=="bn"?(DIM[a[0][0]][0]/DIM[a[0][0]][1]).toFixed(3):"";
h+=`<div class="gg ${c}" style="--c:${col};${ar?"--ar:"+ar:""}">${a.map(([k,j])=>btn(k,j)).join("")}</div>`});return h+"</div>"}
function proj(id){const p=P.find(x=>x.id==id),t=T[L],i=li(L),n=P[(P.indexOf(p)+1)%P.length];
$("#pj").innerHTML=`<div class="pb"><button class="back" id="bk">${t.back}</button><div class="lang"><button data-l="en">EN</button><button data-l="ar">عربي</button></div></div>
<header class="ph"><div class="wrap phg"><div><p class="lab">${p.cats.map(c=>t[c]).join(" · ")}</p><h1>${p.t[i]}</h1></div><div class="cv"><img src="${IMG[p.cover]}" alt="${p.t[i]}"></div></div></header>
<div class="wrap"><div class="meta"><div><small>${t.cl}</small><span>${p.t[i]}</span></div><div><small>${t.yr}</small><span>2026</span></div><div><small>${t.cat}</small><span>${p.cats.map(c=>t[c]).join(", ")}</span></div><div><small>${t.srv}</small><span>${p.s[i]}</span></div></div>
<div class="two"><div><h2>${t.br}</h2><p>${p.d[i]}</p></div><div><h2>${p.f?t.feat:t.dl}</h2>${p.f?`<ul class="ft">${p.f.map(x=>`<li>${x[i]}</li>`).join("")}</ul>`:`<p>${p.pc?p.pc[i]:p.n+" "+t.pcs} · ${p.s[i]}</p>`}</div></div>${p.site?`<div class="dev" id="dev"><h2 style="margin-bottom:6px">${t.pv}</h2><p style="margin:0 0 20px;color:var(--mut)">${t.pvn}</p><div class="tb"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="url">nutrio-meals</span><span class="tg"><button data-m="d" aria-pressed="true">${t.dsk}</button><button data-m="m" aria-pressed="false">${t.mob}</button></span></div><div class="st"><iframe id="sf" title="${p.t[i]}" sandbox="allow-scripts allow-popups allow-same-origin"></iframe></div><a class="btn wine go" id="so" href="#" target="_blank" rel="noopener">${t.open}</a></div>`:""}
<div class="gl"><h2>${t.gl}</h2>${galHTML(p,i)}</div></div>
<a class="nx" href="#${n.id}"><small>${t.nx}</small><h2>${n.t[i]}</h2></a>`;
$("#bk").onclick=()=>{location.hash="work"};
if(p.site){const u="site/nutrio.html";$("#sf").src=u;$("#sf").loading="lazy";$("#so").href=u;document.querySelectorAll("#dev .tg button").forEach(b=>b.onclick=()=>{$("#dev").classList.toggle("mob",b.dataset.m=="m");document.querySelectorAll("#dev .tg button").forEach(x=>x.setAttribute("aria-pressed",x==b))})}
document.querySelectorAll(".gal button").forEach(b=>b.onclick=()=>{$("#lbi").src=IMG[b.dataset.k];$("#lb").showModal()});
document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==L))}
function setL(l){L=l;sv("lang",l);document.documentElement.lang=l;document.documentElement.dir=l=="ar"?"rtl":"ltr";document.title=l=="ar"?"نوران بحيرى — مصممة جرافيك":"Noran Behery — Graphic Designer";route(true)}
function route(keep){const id=location.hash.slice(1),p=P.find(x=>x.id==id);document.body.classList.toggle("pj",!!p);
if(p){proj(id);if(!keep)window.scrollTo(0,0)}else{const y=scrollY;home();if(!keep&&id){const e=document.getElementById(id);e&&e.scrollIntoView()}else if(keep)scrollTo(0,y)}}
document.addEventListener("click",e=>{const b=e.target.closest(".lang button");if(b)setL(b.dataset.l)});
$("#lb").onclick=()=>$("#lb").close();
$("#f").onsubmit=e=>{e.preventDefault();const b=`${T[L].f_n}: ${$("#n").value}\n${T[L].f_e}: ${$("#e").value}\n\n${$("#m").value}`;location.href=`mailto:${CFG.email}?subject=${encodeURIComponent("New project from "+$("#n").value)}&body=${encodeURIComponent(b)}`};
window.addEventListener("hashchange",()=>route(false));
document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";if(L=="ar")document.title="نوران بحيرى — مصممة جرافيك";route(false);
</script></body></html>
